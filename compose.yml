services:
  wedding-db:
    image: postgres
    volumes:
      - ./.db:/var/lib/postgresql
    env_file:
      - .env
    environment:
      - PGUSER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wedding-server:
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ALLOW_ORIGINS: "http://localhost:8086"
    depends_on:
      wedding-db:
        condition: service_healthy
    restart: unless-stopped

  wedding-web:
    build:
      dockerfile: web.Dockerfile
      context: .
    environment:
      BACKEND_HOST: server
      BACKEND_PORT: 8080
    ports:
      - "8086:80"
    restart: unless-stopped
